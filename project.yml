name: InstaNoReels
options:
  bundleIdPrefix: com.personal.instanoreels
  deploymentTarget:
    iOS: "16.0"
targets:
  InstaNoReels:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: InstaNoReels
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: "Needed to take photos and videos for posts and stories."
        NSMicrophoneUsageDescription: "Needed to record audio for videos and stories."
        NSPhotoLibraryUsageDescription: "Needed to choose photos and videos to post."
        NSPhotoLibraryAddUsageDescription: "Needed to save photos and videos to your library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.instanoreels
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
